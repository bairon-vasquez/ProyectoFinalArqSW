# Base de datos del sistema de boletería: solo PostgreSQL.
# Lee POSTGRES_USER, POSTGRES_PASSWORD y POSTGRES_DB del archivo .env (ver .env.example).
# Levantar: docker compose up -d
services:
  postgres:
    # [NECESITA ACLARACIÓN: ¿qué versión mayor de PostgreSQL se fija? (ADR-004).
    # Reemplace <versión> por ese número; mientras tanto el archivo no arranca.]
    image: postgres:<versión>
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_datos:/var/lib/postgresql/data

volumes:
  postgres_datos:
